<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#4c0519" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c082"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8b6c2c"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Background Ring -->
  <rect width="100" height="100" rx="18" fill="#09090c"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldFiligree)" stroke-width="1.5" stroke-dasharray="1 3"/>
  <circle cx="50" cy="50" r="42" fill="url(#candleGlow)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#991b1b" stroke-width="1.2"/>

  <!-- Gothic Pointed Arch Filigree -->
  <path d="M 50,14 C 42,28 32,36 32,56 C 32,70 40,82 50,86 C 60,82 68,70 68,56 C 68,36 58,28 50,14 Z" fill="none" stroke="url(#goldFiligree)" stroke-width="1.8"/>

  <!-- Ornate Gothic Monogram "Z" / Fleur-de-lis Crest -->
  <path d="M 38,36 L 62,36 L 40,64 L 64,64" fill="none" stroke="#f1ece1" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>
  
  <!-- Central Crimson Crossbar / Diamond -->
  <polygon points="50,47 53,50 50,53 47,50" fill="#e11d48"/>

  <!-- Filigree Fleurons -->
  <circle cx="50" cy="22" r="2.2" fill="#c5a059"/>
  <circle cx="50" cy="78" r="2.2" fill="#c5a059"/>
  <circle cx="28" cy="50" r="1.8" fill="#c5a059"/>
  <circle cx="72" cy="50" r="1.8" fill="#c5a059"/>
</svg>
