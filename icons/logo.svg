<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Octagon / Hex Rim -->
  <polygon points="50,4 88,26 88,74 50,96 12,74 12,26" fill="#0b1120" stroke="url(#cyanGrad)" stroke-width="3.5" />
  
  <!-- Circuit Nodes -->
  <circle cx="50" cy="14" r="2" fill="#00f0ff" />
  <circle cx="80" cy="31" r="2" fill="#00f0ff" />
  <circle cx="80" cy="69" r="2" fill="#00f0ff" />
  <circle cx="50" cy="86" r="2" fill="#00f0ff" />
  <circle cx="20" cy="69" r="2" fill="#00f0ff" />
  <circle cx="20" cy="31" r="2" fill="#00f0ff" />
  
  <!-- Pin Tumbler Cylinder Core / Keyway -->
  <circle cx="50" cy="46" r="22" fill="#131c31" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- High Tech Paracentric Keyway Silhouette -->
  <path d="M 47,32 
           L 53,32 
           L 53,40 
           L 56,41 
           L 53,44 
           L 55,47 
           L 51,50 
           L 53,53 
           L 49,57 
           L 47,57 
           L 49,51 
           L 45,48 
           L 48,43 
           L 45,41 
           L 47,38 Z" 
        fill="#00f0ff" 
        filter="url(#glow)" />
        
  <!-- Prairie Wheat / Craft Accents at Bottom -->
  <path d="M 40,78 Q 45,71 50,65 Q 55,71 60,78" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <path d="M 36,83 Q 44,77 50,71 Q 56,77 64,83" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
</svg>
